<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Klassik">
<meta name="theme-color" content="#1d2a24">
<title>Klassik</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* VOICE: ruhig, warm, nichts Überflüssiges. Für einen älteren Herrn.
   IDEA: ein altes Radio mit großen Tasten.
   PICTURE: Mikrofon-Taste oben, darunter die zuletzt gehörten Stücke.
   COLOUR and TYPE: Tannengrün, Elfenbein, Messing. Atkinson Hyperlegible.
   LAYOUT: eine Spalte, alles Wichtige auf dem ersten Bildschirm, Steuerung unten. */
:root{--bg:#1d2a24;--panel:#26372f;--ink:#f6efe0;--soft:#c9c0ac;--brass:#d9a441;--red:#c8463a}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:20px/1.3 "Atkinson Hyperlegible",system-ui,sans-serif;
  padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 140px);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;cursor:pointer;-webkit-user-select:none;user-select:none}
h2{font-size:18px;font-weight:700;margin:16px 4px 8px;color:var(--brass)}
.mic{display:flex;align-items:center;justify-content:center;gap:14px;width:100%;height:84px;border-radius:22px;
  background:var(--brass);color:#1d2a24;font-weight:700;font-size:22px;padding:0 14px}
.mic svg{width:44px;height:44px;flex:none}
.mic.on{background:var(--red);color:#fff;animation:pulse 1.2s infinite}
.mic.busy{background:#8a7a52;color:#1d2a24}
@keyframes pulse{50%{opacity:.8}}
@media(prefers-reduced-motion:reduce){.mic.on{animation:none}}
.heard{min-height:24px;margin:6px 4px 0;color:var(--soft);font-size:17px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.b{display:flex;flex-direction:column;justify-content:center;width:100%;text-align:left;padding:8px 12px;border-radius:16px;
  background:var(--panel);font-size:18px;font-weight:700;min-height:62px;border:2px solid transparent;line-height:1.15}
.b small{display:block;font-weight:400;font-size:15px;color:var(--soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.b:active,.b:focus-visible{border-color:var(--brass);outline:none}
.b.playing{border-color:var(--brass)}
.radio{background:#33473d;text-align:center;align-items:center}
.recent{background:#2e4238}
.hide{display:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:#101a15;border-top:3px solid var(--brass);
  padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.now{font-size:17px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:8px}
.now b{color:var(--ink)}
.ctl{display:grid;grid-template-columns:1fr 2fr 1fr;gap:8px}
.ctl button{height:68px;border-radius:18px;background:var(--panel);font-size:22px;font-weight:700}
.ctl .pp{background:var(--brass);color:#1d2a24;font-size:26px}
.ctl button:disabled{opacity:.35}
@media(min-width:700px){body{max-width:720px;margin:0 auto}}
</style>
</head>
<body>

<button class="mic" id="mic" aria-label="Sprechen">
  <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 15a4 4 0 0 0 4-4V5a4 4 0 0 0-8 0v6a4 4 0 0 0 4 4Zm7-4a1 1 0 1 0-2 0 5 5 0 0 1-10 0 1 1 0 1 0-2 0 7 7 0 0 0 6 6.92V21H8a1 1 0 1 0 0 2h8a1 1 0 1 0 0-2h-3v-3.08A7 7 0 0 0 19 11Z"/></svg>
  <span id="micText">Drücken und Wunsch sagen</span>
</button>
<div class="heard" id="heard"></div>

<div id="altBox" class="hide"><h2>Andere Aufnahmen</h2><div class="grid" id="alts"></div></div>
<div id="recentBox" class="hide"><h2>Zuletzt gehört</h2><div class="grid" id="recent"></div></div>

<h2>Radio</h2>
<div class="grid three" id="radios"></div>

<h2>Lieblingsstücke</h2>
<div class="grid" id="favs"></div>

<div class="bar">
  <div class="now" id="now">Noch nichts ausgewählt</div>
  <div class="ctl">
    <button id="prev" aria-label="Zurück" disabled>◀◀</button>
    <button id="pp" class="pp" aria-label="Abspielen oder Pause" disabled>▶ Spielen</button>
    <button id="next" aria-label="Weiter" disabled>▶▶</button>
  </div>
</div>
<audio id="audio" preload="none" playsinline></audio>

<script>
{
const API="https://klassik-suche-opa.wienboeker-consulting.workers.dev/";
const RADIOS=[
  {name:"BR-Klassik",url:"https://dispatcher.rndfnk.com/br/brklassik/live/mp3/high"},
  {name:"WDR 3",url:"https://wdr-wdr3-live.icecastssl.wdr.de/wdr/wdr3/live/mp3/256/stream.mp3"},
  {name:"Klara",url:"https://icecast.vrtcdn.be/klara-high.mp3"}
];
const FAVS=[
  ["Mondscheinsonate","Beethoven"],["Für Elise","Beethoven"],
  ["Eine kleine Nachtmusik","Mozart"],["Die vier Jahreszeiten","Vivaldi"],
  ["Air","Bach"],["Nocturnes","Chopin"],
  ["An der schönen blauen Donau","Strauss"],["Die Moldau","Smetana"]
];
// Notlösung ohne KI: deutsche Begriffe, die im Archiv meist englisch heißen
const DICT={"mondscheinsonate":"moonlight sonata","für elise":"fur elise","vier jahreszeiten":"four seasons",
 "sinfonie":"symphony","symphonie":"symphony","klavierkonzert":"piano concerto","violinkonzert":"violin concerto",
 "klavier":"piano","geige":"violin","schwanensee":"swan lake","nussknacker":"nutcracker","blauen donau":"blue danube",
 "zauberflöte":"magic flute","tschaikowsky":"tchaikovsky","tschaikowski":"tchaikovsky","händel":"handel","moldau":"moldau",
 "kleine nachtmusik":"kleine nachtmusik","nocturnes":"nocturne"};
const FILL=/\b(spiel|spiele|spielen|mal|bitte|etwas|was|ich|möchte|will|würde|gern|gerne|hören|von|vom|die|der|das|den|dem|ein|eine|einen|musik|stück|mir|doch|noch|und|ruhiges|fröhliches|schönes)\b/g;

const $=id=>document.getElementById(id),audio=$("audio");
let queue=[],idx=0,title="";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const btn=(t,s,cls="")=>`<button class="b ${cls}"><span>${esc(t)}</span>${s?`<small>${esc(s)}</small>`:""}</button>`;
const setNow=h=>$("now").innerHTML=h;
const say=t=>$("heard").textContent=t;

$("radios").innerHTML=RADIOS.map(r=>btn(r.name,"","radio")).join("");
[...$("radios").children].forEach((b,i)=>b.onclick=()=>playRadio(RADIOS[i]));
$("favs").innerHTML=FAVS.map(f=>btn(f[0],f[1])).join("");
[...$("favs").children].forEach((b,i)=>b.onclick=()=>search(FAVS[i][0]+" von "+FAVS[i][1]));

/* ---------- Zuletzt gehört (bleibt auf diesem iPhone gespeichert) ---------- */
function loadRecent(){try{return JSON.parse(localStorage.getItem("klassik_recent")||"[]")}catch(e){return []}}
function saveRecent(entry){
  try{
    const key=entry.kind+":"+(entry.id||entry.name);
    const list=[entry,...loadRecent().filter(e=>e.kind+":"+(e.id||e.name)!==key)].slice(0,4);
    localStorage.setItem("klassik_recent",JSON.stringify(list));
  }catch(e){}
  renderRecent();
}
function renderRecent(){
  const list=loadRecent();
  $("recentBox").classList.toggle("hide",!list.length);
  $("recent").innerHTML=list.map(e=>btn(e.titel||e.name,e.kind==="radio"?"Radio":"","recent")).join("");
  [...$("recent").children].forEach((b,i)=>b.onclick=()=>{
    const e=list[i];
    if(e.kind==="radio"){const r=RADIOS.find(x=>x.name===e.name);if(r)playRadio(r)}
    else playItem(e.id,e.titel);
  });
}
renderRecent();

/* ---------- Suche: erst KI, sonst einfache Archiv-Suche ---------- */
async function search(text){
  say("Ich suche „"+text+"“ …");
  $("altBox").classList.add("hide");
  setBusy(true);
  let picks=[];
  try{
    const ctl=new AbortController();setTimeout(()=>ctl.abort(),20000);
    const r=await fetch(API+"?text="+encodeURIComponent(text),{signal:ctl.signal});
    const j=await r.json();picks=(j.picks||[]).filter(p=>p.identifier);
  }catch(e){}
  if(!picks.length) picks=await simpleSearch(text);
  setBusy(false);
  if(!picks.length){say("Leider nichts gefunden. Bitte anders sagen.");return}
  say("");
  playItem(picks[0].identifier,picks[0].titel);
  const rest=picks.slice(1,5);
  $("altBox").classList.toggle("hide",!rest.length);
  $("alts").innerHTML=rest.map(p=>btn(p.titel,"")).join("");
  [...$("alts").children].forEach((b,i)=>b.onclick=()=>playItem(rest[i].identifier,rest[i].titel));
}
async function simpleSearch(text){
  let t=" "+text.toLowerCase()+" ";
  for(const k of Object.keys(DICT).sort((a,b)=>b.length-a.length)) t=t.split(k).join(" "+DICT[k]+" ");
  const q=t.replace(FILL," ").replace(/[^\p{L}\p{N} ]/gu," ").replace(/\s+/g," ").trim();
  if(!q) return [];
  try{
    const words=q.split(" ").map(w=>`"${w}"`).join(" AND ");
    const u="https://archive.org/advancedsearch.php?q="+encodeURIComponent(`(${words}) AND mediatype:audio`)+
      "&fl[]=identifier&fl[]=title&sort[]=downloads+desc&rows=4&output=json";
    const docs=(await (await fetch(u)).json()).response.docs||[];
    return docs.map(d=>({identifier:d.identifier,titel:clip(d.title)}));
  }catch(e){return []}
}
const clip=s=>{s=[].concat(s||"Ohne Titel")[0];return s.length>50?s.slice(0,48)+"…":s};

/* ---------- Abspielen ---------- */
async function playItem(id,titel){
  setNow("Lade …");
  try{
    const m=await (await fetch("https://archive.org/metadata/"+encodeURIComponent(id))).json();
    const files=(m.files||[]).filter(f=>/mp3/i.test(f.format||"")||/\.mp3$/i.test(f.name))
      .filter(f=>!/_64kb|sample/i.test(f.name)).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
    if(!files.length){setNow("Dieses Stück lässt sich nicht abspielen. Bitte ein anderes wählen.");return}
    title=titel||clip(m.metadata&&m.metadata.title);
    queue=files.map(f=>({src:`https://archive.org/download/${encodeURIComponent(id)}/${encodeURIComponent(f.name)}`}));
    idx=0;start();
    saveRecent({kind:"item",id,titel:title});
  }catch(e){setNow("Keine Verbindung zum Internet.")}
}
function playRadio(r){queue=[{src:r.url}];idx=0;title=r.name;start();saveRecent({kind:"radio",name:r.name})}
function start(){
  audio.src=queue[idx].src;
  audio.play().catch(()=>setNow(`<b>${esc(title)}</b> · bitte auf ▶ drücken`));
  const part=queue.length>1?` · Teil ${idx+1} von ${queue.length}`:"";
  setNow(`<b>${esc(title)}</b>${part}`);
  if("mediaSession" in navigator) navigator.mediaSession.metadata=new MediaMetadata({title,artist:queue.length>1?`Teil ${idx+1}`:"Klassik"});
  $("pp").disabled=false;$("prev").disabled=idx===0;$("next").disabled=idx>=queue.length-1;
}
audio.onended=()=>{if(idx<queue.length-1){idx++;start()}};
audio.onplay=()=>$("pp").textContent="❚❚ Pause";
audio.onpause=()=>$("pp").textContent="▶ Spielen";
audio.onerror=()=>setNow("Das ließ sich nicht abspielen. Bitte etwas anderes wählen.");
$("pp").onclick=()=>audio.paused?audio.play():audio.pause();
$("prev").onclick=()=>{if(idx>0){idx--;start()}};
$("next").onclick=()=>{if(idx<queue.length-1){idx++;start()}};
if("mediaSession" in navigator){
  const ms=navigator.mediaSession;
  ms.setActionHandler("play",()=>audio.play());ms.setActionHandler("pause",()=>audio.pause());
  ms.setActionHandler("nexttrack",()=>$("next").click());ms.setActionHandler("previoustrack",()=>$("prev").click());
}

/* ---------- Mikrofon (Spracherkennung von Safari) ---------- */
function setBusy(on){$("mic").classList.toggle("busy",on);$("micText").textContent=on?"Einen Moment …":"Drücken und Wunsch sagen"}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){$("micText").textContent="Sprechen geht hier leider nicht";$("mic").disabled=true;$("mic").style.opacity=.5}
else{
  let rec=null;
  $("mic").onclick=()=>{
    if($("mic").classList.contains("busy")) return;
    if(rec){rec.stop();return}
    rec=new SR();rec.lang="de-DE";rec.interimResults=true;rec.maxAlternatives=1;
    let final="";
    rec.onresult=e=>{const r=[...e.results].map(x=>x[0].transcript).join(" ");say("„"+r+"“");
      if(e.results[e.results.length-1].isFinal) final=r};
    rec.onend=()=>{$("mic").classList.remove("on");rec=null;
      if(final) search(final); else setBusy(false)};
    rec.onerror=()=>say("Das hat nicht geklappt. Bitte noch einmal drücken.");
    $("mic").classList.add("on");$("micText").textContent="Ich höre zu … (zum Beenden drücken)";say("");
    try{rec.start()}catch(e){rec=null;$("mic").classList.remove("on")}
  };
}
}
</script>
</body>
</html>
