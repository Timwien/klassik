<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Klassik">
<meta name="theme-color" content="#1d2a24">
<title>Klassik</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* VOICE: ruhig, warm, nichts Überflüssiges. Für einen älteren Herrn.
   IDEA: ein altes Radio mit großen Tasten.
   PICTURE: Mikrofon-Taste oben, darunter die zuletzt gehörten Stücke.
   COLOUR and TYPE: Tannengrün, Elfenbein, Messing. Atkinson Hyperlegible.
   LAYOUT: eine Spalte, alles Wichtige auf dem ersten Bildschirm, Steuerung unten. */
:root{--bg:#1d2a24;--panel:#26372f;--ink:#f6efe0;--soft:#c9c0ac;--brass:#d9a441;--red:#c8463a}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:20px/1.3 "Atkinson Hyperlegible",system-ui,sans-serif;
  padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 140px);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;cursor:pointer;-webkit-user-select:none;user-select:none}
h2{font-size:18px;font-weight:700;margin:16px 4px 8px;color:var(--brass)}
.mic{display:flex;align-items:center;justify-content:center;gap:14px;width:100%;height:84px;border-radius:22px;
  background:var(--brass);color:#1d2a24;font-weight:700;font-size:22px;padding:0 14px}
.mic svg{width:44px;height:44px;flex:none}
.mic.on{background:var(--red);color:#fff;animation:pulse 1.2s infinite}
.mic.busy{background:#8a7a52;color:#1d2a24}
@keyframes pulse{50%{opacity:.8}}
@media(prefers-reduced-motion:reduce){.mic.on{animation:none}}
.heard{min-height:24px;margin:6px 4px 0;color:var(--soft);font-size:17px}
.type{display:flex;gap:8px;margin-top:8px}
.type input{flex:1;height:52px;font:inherit;font-size:19px;padding:0 14px;border-radius:16px;border:2px solid #3d5247;background:var(--panel);color:var(--ink)}
.type input::placeholder{color:var(--soft)}
.type input:focus{outline:none;border-color:var(--brass)}
.type button{height:52px;padding:0 16px;border-radius:16px;background:var(--panel);border:2px solid #3d5247;font-size:18px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.b{display:flex;flex-direction:column;justify-content:center;width:100%;text-align:left;padding:8px 12px;border-radius:16px;
  background:var(--panel);font-size:18px;font-weight:700;min-height:62px;border:2px solid transparent;line-height:1.15}
.b small{display:block;font-weight:400;font-size:15px;color:var(--soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.b:active,.b:focus-visible{border-color:var(--brass);outline:none}
.b.playing{border-color:var(--brass)}
.radio{background:#33473d;text-align:center;align-items:center}
.recent{background:#2e4238}
.hide{display:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:#101a15;border-top:3px solid var(--brass);
  padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.now{flex:1;font-size:17px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reload{flex:none;height:40px;padding:0 12px;border-radius:12px;background:var(--panel);font-size:15px;color:var(--soft)}
.oops{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 10px);z-index:9;display:none;
  padding:18px;border-radius:18px;background:var(--red);color:#fff;font-size:20px;font-weight:700;text-align:center}
.oops.show{display:block}
.oops small{display:block;margin-top:10px;font-size:13px;font-weight:400;opacity:.9;word-break:break-word}
.now b{color:var(--ink)}
.ctl{display:grid;grid-template-columns:1fr 2fr 1fr;gap:8px}
.ctl button{height:68px;border-radius:18px;background:var(--panel);font-size:22px;font-weight:700}
.ctl .pp{background:var(--brass);color:#1d2a24;font-size:26px}
.ctl button:disabled{opacity:.35}
@media(min-width:700px){body{max-width:720px;margin:0 auto}}
</style>
</head>
<body>

<button class="mic" id="mic" aria-label="Sprechen">
  <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 15a4 4 0 0 0 4-4V5a4 4 0 0 0-8 0v6a4 4 0 0 0 4 4Zm7-4a1 1 0 1 0-2 0 5 5 0 0 1-10 0 1 1 0 1 0-2 0 7 7 0 0 0 6 6.92V21H8a1 1 0 1 0 0 2h8a1 1 0 1 0 0-2h-3v-3.08A7 7 0 0 0 19 11Z"/></svg>
  <span id="micText">Drücken und Wunsch sagen</span>
</button>
<form class="type" id="form" autocomplete="off">
  <input id="q" type="search" enterkeyhint="search" placeholder="Oder eintippen, z.B. Turandot" aria-label="Suchbegriff eintippen">
  <button aria-label="Suchen">Suchen</button>
</form>
<div class="heard" id="heard"></div>

<div id="altBox" class="hide"><h2>Andere Aufnahmen</h2><div class="grid" id="alts"></div></div>
<div id="recentBox" class="hide"><h2>Zuletzt gehört</h2><div class="grid" id="recent"></div></div>

<h2>Radio</h2>
<div class="grid three" id="radios"></div>

<h2>Lieblingsstücke</h2>
<div class="grid" id="favs"></div>

<div class="bar">
  <div class="top"><div class="now" id="now">Noch nichts ausgewählt</div><button class="reload" onclick="location.reload()" aria-label="App neu starten">↻ Neu starten</button></div>
  <div class="ctl">
    <button id="prev" aria-label="Zurück" disabled>◀◀</button>
    <button id="pp" class="pp" aria-label="Abspielen oder Pause" disabled>▶ Spielen</button>
    <button id="next" aria-label="Weiter" disabled>▶▶</button>
  </div>
</div>
<audio id="audio" preload="none" playsinline></audio>
<button class="oops" id="oops" onclick="location.reload()">Da ist etwas schiefgegangen.<br>Hier tippen zum Neustarten<small id="oopsInfo"></small></button>

<script>
// Bei einem unerwarteten Fehler großen Neustart-Knopf zeigen,
// darunter klein die eigentliche Fehlermeldung (hilft bei der Fehlersuche per Foto)
function oops(info){
  document.getElementById("oops").classList.add("show");
  const el=document.getElementById("oopsInfo");
  if(el&&!el.textContent) el.textContent=String(info||"unbekannt").slice(0,200);
}
window.addEventListener("error",e=>{
  const file=(e.filename||"").split("/").pop();
  oops((e.message||"Fehler")+(e.lineno?` (${file||"Seite"} Zeile ${e.lineno})`:""));
});
window.addEventListener("unhandledrejection",e=>{
  const r=e.reason;
  oops("Promise: "+(r&&(r.name||r.message)?`${r.name||""} ${r.message||""}`.trim():String(r)));
});
</script>
<script>
(function(){ // als Funktion statt Block: ältere Safari-Versionen finden sonst $ nicht
const API="https://klassik-suche-opa.wienboeker-consulting.workers.dev/";
const RADIOS=[
  {name:"BR-Klassik",url:"https://dispatcher.rndfnk.com/br/brklassik/live/mp3/high"},
  {name:"WDR 3",url:"https://wdr-wdr3-live.icecastssl.wdr.de/wdr/wdr3/live/mp3/256/stream.mp3"},
  {name:"Klara",url:"https://icecast.vrtcdn.be/klara-high.mp3"}
];
// Lieblingsstücke mit fest hinterlegten Aufnahmen (von der KI ausgewählt), damit sie sofort starten
const FAVS=[
  {name:"Mondscheinsonate",by:"Beethoven",picks:[["MoonlightSonata_755","Mondscheinsonate – Beethoven"],["SonataNo.14MoonlightOp.27No.2","Klaviersonate Nr. 14 op. 27/2"],["BeethovenPianoSonataNo.14moonlightrubinstein","Mondscheinsonate – Rubinstein"]]},
  {name:"Für Elise",by:"Beethoven",picks:[["FurElise_656","Für Elise – Beethoven"],["BeethovenBagatelleInAMinorFuerEliseschnabel","Für Elise – Schnabel"],["dx-974-beethoven-bagatelle-op-33-2","Für Elise – Eileen Joyce (1940)"]]},
  {name:"Eine kleine Nachtmusik",by:"Mozart",picks:[["MOZARTSerenadeEineKleineNachtmusikK.525-NEWTRANSFER01.I.Allegro","Eine kleine Nachtmusik – Bruno Walter"],["MozartEineKleineNachtmusik_102","Eine kleine Nachtmusik – Mozart"],["EineKleineNachtmusik_201608","Eine kleine Nachtmusik – Mozart"]]},
  {name:"Die vier Jahreszeiten",by:"Vivaldi",picks:[["lp_the-four-seasons_antonio-vivaldi_0","Die vier Jahreszeiten – Vivaldi"],["lp_the-four-seasons_antonio-vivaldi_2","Die vier Jahreszeiten – Vivaldi"],["Vivaldi_Quattro_Stagioni","Quattro Stagioni – Vivaldi"]]},
  {name:"Air",by:"Bach",picks:[["J.S.BachAir","Air – Bach, Koussevitzky"],["78_air-on-the-g-string_bach_gbia0012890a","Air on the G String – Bach"],["JohannSebastianBachOrchestralSuiteNo.3BWV1068II.AirFromSeven","Air aus Orchestersuite Nr. 3"]]},
  {name:"Nocturnes",by:"Chopin",picks:[["FredericChopinNocturneOp.9No.1InBFlatMinor","Nocturne op. 9 Nr. 1 – Chopin"],["CaelaHarrisonNocturneinGminor_Op.15No.3_Chopin_","Nocturne op. 15 Nr. 3 – Chopin"]]},
  {name:"An der schönen blauen Donau",by:"Strauss",picks:[["JOHANNSTRAUSSTheBlueDanube-Waltz-NEWTRANSFERJOHANNSTRAUSSTheBlueDanubeWaltz","Blaue Donau – Szell"],["AnDerSchnemBlauenDonau","Blaue Donau – Strauss"],["TheBlueDanube","The Blue Danube – Strauss"]]},
  {name:"Die Moldau",by:"Smetana",picks:[["Friedrich_Smetana_-_Die_Moldau","Die Moldau – Smetana"],["SMETANATheMoldau-NEWTRANSFER","Die Moldau – Kindler"],["78_from-bohemias-meadows-and-forests-z-eskyh-luhv-a-hjv_czech-philharmonic-orc_gbia7013465","Die Moldau – Kubelik"]]}
];
// Notlösung ohne KI: deutsche Begriffe, die im Archiv meist englisch heißen
const DICT={"mondscheinsonate":"moonlight sonata","für elise":"fur elise","vier jahreszeiten":"four seasons",
 "sinfonie":"symphony","symphonie":"symphony","klavierkonzert":"piano concerto","violinkonzert":"violin concerto",
 "klavier":"piano","geige":"violin","schwanensee":"swan lake","nussknacker":"nutcracker","blauen donau":"blue danube",
 "zauberflöte":"magic flute","tschaikowsky":"tchaikovsky","tschaikowski":"tchaikovsky","händel":"handel","moldau":"moldau",
 "kleine nachtmusik":"kleine nachtmusik","nocturnes":"nocturne"};
const FILL=/\b(spiel|spiele|spielen|mal|bitte|etwas|was|ich|möchte|will|würde|gern|gerne|hören|von|vom|die|der|das|den|dem|ein|eine|einen|musik|stück|mir|doch|noch|und|ruhiges|fröhliches|schönes)\b/g;

const $=id=>document.getElementById(id),audio=$("audio");
let queue=[],idx=0,title="";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const btn=(t,s,cls="")=>`<button class="b ${cls}"><span>${esc(t)}</span>${s?`<small>${esc(s)}</small>`:""}</button>`;
const setNow=h=>$("now").innerHTML=h;
const say=t=>$("heard").textContent=t;

$("radios").innerHTML=RADIOS.map(r=>btn(r.name,"","radio")).join("");
[...$("radios").children].forEach((b,i)=>b.onclick=()=>playRadio(RADIOS[i]));
$("favs").innerHTML=FAVS.map(f=>btn(f.name,f.by)).join("");
[...$("favs").children].forEach((b,i)=>b.onclick=()=>{
  const p=FAVS[i].picks.map(x=>({identifier:x[0],titel:x[1]}));
  say("");playItem(p[0].identifier,p[0].titel);showAlts(p.slice(1));
});

/* iPhone erlaubt Abspielen nur direkt nach einem Fingertipp. Deshalb beim ersten Tipp
   kurz einen stummen Ton abspielen: danach darf die App auch später selbst starten. */
const SILENT="data:audio/wav;base64,UklGRrQBAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YZABAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA";
let unlocked=false;
function unlock(){
  if(unlocked) return;
  try{audio.src=SILENT;const p=audio.play();if(p)p.then(()=>{audio.pause();unlocked=true}).catch(()=>{})}catch(e){}
}
document.addEventListener("touchend",unlock,{capture:true});
document.addEventListener("click",unlock,{capture:true});

/* ---------- Zuletzt gehört (bleibt auf diesem iPhone gespeichert) ---------- */
function loadRecent(){try{return JSON.parse(localStorage.getItem("klassik_recent")||"[]")}catch(e){return []}}
function saveRecent(entry){
  try{
    const key=entry.kind+":"+(entry.id||entry.name);
    const list=[entry,...loadRecent().filter(e=>e.kind+":"+(e.id||e.name)!==key)].slice(0,4);
    localStorage.setItem("klassik_recent",JSON.stringify(list));
  }catch(e){}
  renderRecent();
}
function renderRecent(){
  const list=loadRecent();
  $("recentBox").classList.toggle("hide",!list.length);
  $("recent").innerHTML=list.map(e=>btn(e.titel||e.name,e.kind==="radio"?"Radio":"","recent")).join("");
  [...$("recent").children].forEach((b,i)=>b.onclick=()=>{
    const e=list[i];
    if(e.kind==="radio"){const r=RADIOS.find(x=>x.name===e.name);if(r)playRadio(r)}
    else playItem(e.id,e.titel);
  });
}
renderRecent();

/* ---------- Suche: erst KI, sonst einfache Archiv-Suche ---------- */
async function search(text){
  say("Ich suche „"+text+"“ …");
  $("altBox").classList.add("hide");
  setBusy(true);
  let picks=[];
  try{
    const ctl=new AbortController();setTimeout(()=>ctl.abort(),20000);
    const r=await fetch(API+"?text="+encodeURIComponent(text),{signal:ctl.signal});
    const j=await r.json();picks=(j.picks||[]).filter(p=>p.identifier);
  }catch(e){}
  if(!picks.length) picks=await simpleSearch(text);
  setBusy(false);
  showPicks(picks,"");
}
function showPicks(picks,heardText){
  if(!picks.length){say((heardText?"„"+heardText+"“ – ":"")+"Leider nichts gefunden. Bitte anders sagen.");return}
  say(heardText?"„"+heardText+"“":"");
  playItem(picks[0].identifier,picks[0].titel);
  showAlts(picks.slice(1,5));
}

$("form").onsubmit=e=>{
  e.preventDefault();
  const v=$("q").value.trim();
  if(v.length<2||$("mic").classList.contains("busy")) return;
  $("q").blur();$("q").value="";
  search(v);
};

/* ---------- Aufnahme: Stimme aufnehmen, an Mistral schicken (über den Worker) ---------- */
const CAN_RECORD=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);
let recState=null; // läuft gerade eine Aufnahme?
async function recordAndSearch(){
  if(recState){recState.stop();return}            // zweiter Tipp beendet die Aufnahme
  audio.pause();
  const AC=window.AudioContext||window.webkitAudioContext;
  let ctx=null;                                    // im Fingertipp erzeugen, sonst blockiert iOS
  try{ctx=AC?new AC():null;if(ctx&&ctx.state==="suspended")ctx.resume().catch(()=>{})}catch(e){ctx=null}
  const closeCtx=()=>{try{if(ctx)ctx.close().catch(()=>{})}catch(e){}};
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}
  catch(e){
    closeCtx();setBusy(false);
    say(e&&e.name==="NotAllowedError"?"Bitte das Mikrofon erlauben und noch einmal drücken."
      :"Das Mikrofon lässt sich nicht starten ("+((e&&e.name)||"unbekannt")+"). Bitte eintippen.");
    return;
  }
  let rec,mime="";
  try{
    mime=["audio/mp4","audio/webm;codecs=opus","audio/webm"].find(m=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m))||"";
    rec=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);
  }catch(e){
    stream.getTracks().forEach(t=>t.stop());closeCtx();setBusy(false);
    say("Aufnehmen geht auf diesem Handy nicht ("+((e&&e.name)||"unbekannt")+"). Bitte eintippen.");
    return;
  }
  const chunks=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  // Stille erkennen: nach gesprochenen Worten 1,3 Sekunden Ruhe = fertig.
  // Liefert die Lautstärkemessung nur Nullen (ältere iPhones), wird stattdessen 6 Sekunden aufgenommen.
  let spoke=false,lastLoud=Date.now(),noise=1,loudest=0,deaf=false;const t0=Date.now();
  let an=null,buf=null;
  try{if(ctx){an=ctx.createAnalyser();an.fftSize=1024;ctx.createMediaStreamSource(stream).connect(an);buf=new Uint8Array(an.fftSize)}}
  catch(e){an=null}
  const timer=setInterval(()=>{
    const now=Date.now();
    if(an&&!deaf){
      an.getByteTimeDomainData(buf);let s=0;for(let i=0;i<buf.length;i++){const v=(buf[i]-128)/128;s+=v*v}
      const rms=Math.sqrt(s/buf.length);loudest=Math.max(loudest,rms);
      if(now-t0<400) noise=Math.min(noise,Math.max(rms,0.003));
      if(rms>Math.max(0.025,noise*3)){spoke=true;lastLoud=now}
      if(now-t0>1500&&loudest<0.0005) deaf=true;  // Messung tot
    }else if(now-t0>1500) spoke=true;
    const fixedEnd=(!an||deaf)&&now-t0>6000;
    if(fixedEnd||(an&&!deaf&&spoke&&now-lastLoud>1300)||(!spoke&&now-t0>7000)||now-t0>15000) stop();
  },100);
  function stop(){try{if(rec.state!=="inactive")rec.stop()}catch(e){}}
  recState={stop:()=>{if(Date.now()-t0>1000)spoke=true;stop()}}; // Tipp zum Beenden: Aufnahme gilt als gesprochen
  $("mic").classList.add("on");$("micText").textContent="Ich höre zu …";say("Zum Beenden noch einmal drücken.");
  rec.onstop=async()=>{
    clearInterval(timer);recState=null;
    stream.getTracks().forEach(t=>t.stop());closeCtx();
    $("mic").classList.remove("on");
    if(!spoke||!chunks.length){setBusy(false);say("Ich habe nichts gehört. Bitte noch einmal drücken.");return}
    const type=(rec.mimeType||mime||"audio/mp4").split(";")[0];
    const blob=new Blob(chunks,{type});
    setBusy(true);say("Ich suche …");$("altBox").classList.add("hide");
    let j=null;
    try{
      const ctl=new AbortController();setTimeout(()=>ctl.abort(),25000);
      const r=await fetch(API,{method:"POST",headers:{"Content-Type":type},body:blob,signal:ctl.signal});
      j=await r.json();
    }catch(e){}
    let picks=((j&&j.picks)||[]).filter(p=>p.identifier);
    const heardText=(j&&j.text)||"";
    if(!picks.length&&heardText) picks=await simpleSearch(heardText);
    setBusy(false);
    if(!j){say("Keine Verbindung. Bitte noch einmal versuchen.");return}
    if(!heardText&&!picks.length){say("Ich habe dich nicht verstanden. Bitte noch einmal oder eintippen.");return}
    showPicks(picks,heardText);
  };
  // ohne Zeitscheiben aufnehmen: ältere iPhones liefern sonst kaputte Stücke
  try{rec.start()}catch(e){clearInterval(timer);recState=null;stream.getTracks().forEach(t=>t.stop());closeCtx();
    $("mic").classList.remove("on");setBusy(false);say("Aufnehmen geht auf diesem Handy nicht. Bitte eintippen.")}
}
function showAlts(rest){
  $("altBox").classList.toggle("hide",!rest.length);
  $("alts").innerHTML=rest.map(p=>btn(p.titel,"")).join("");
  [...$("alts").children].forEach((b,i)=>b.onclick=()=>playItem(rest[i].identifier,rest[i].titel));
}
async function simpleSearch(text){
  let t=" "+text.toLowerCase()+" ";
  for(const k of Object.keys(DICT).sort((a,b)=>b.length-a.length)) t=t.split(k).join(" "+DICT[k]+" ");
  const q=t.replace(FILL," ").replace(/[^\p{L}\p{N} ]/gu," ").replace(/\s+/g," ").trim();
  if(!q) return [];
  try{
    const words=q.split(" ").map(w=>`"${w}"`).join(" AND ");
    const u="https://archive.org/advancedsearch.php?q="+encodeURIComponent(`(${words}) AND mediatype:audio`)+
      "&fl[]=identifier&fl[]=title&sort[]=downloads+desc&rows=4&output=json";
    const docs=(await (await fetch(u)).json()).response.docs||[];
    return docs.map(d=>({identifier:d.identifier,titel:clip(d.title)}));
  }catch(e){return []}
}
const clip=s=>{s=[].concat(s||"Ohne Titel")[0];return s.length>50?s.slice(0,48)+"…":s};

/* ---------- Abspielen ---------- */
async function playItem(id,titel){
  setNow("Lade …");
  try{
    const m=await (await fetch("https://archive.org/metadata/"+encodeURIComponent(id))).json();
    const files=(m.files||[]).filter(f=>/mp3/i.test(f.format||"")||/\.mp3$/i.test(f.name))
      .filter(f=>!/_64kb|sample/i.test(f.name)).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
    if(!files.length){setNow("Dieses Stück lässt sich nicht abspielen. Bitte ein anderes wählen.");return}
    title=titel||clip(m.metadata&&m.metadata.title);
    queue=files.map(f=>({src:`https://archive.org/download/${encodeURIComponent(id)}/${encodeURIComponent(f.name)}`}));
    idx=0;start();
    saveRecent({kind:"item",id,titel:title});
  }catch(e){setNow("Keine Verbindung zum Internet.")}
}
function playRadio(r){queue=[{src:r.url}];idx=0;title=r.name;start();saveRecent({kind:"radio",name:r.name})}
function start(){
  audio.src=queue[idx].src;
  audio.play().catch(()=>setNow(`<b>${esc(title)}</b> · bitte auf ▶ drücken`));
  const part=queue.length>1?` · Teil ${idx+1} von ${queue.length}`:"";
  setNow(`<b>${esc(title)}</b>${part}`);
  if("mediaSession" in navigator) navigator.mediaSession.metadata=new MediaMetadata({title,artist:queue.length>1?`Teil ${idx+1}`:"Klassik"});
  $("pp").disabled=false;$("prev").disabled=idx===0;$("next").disabled=idx>=queue.length-1;
}
audio.onended=()=>{if(idx<queue.length-1){idx++;start()}};
audio.onplay=()=>$("pp").textContent="❚❚ Pause";
audio.onpause=()=>$("pp").textContent="▶ Spielen";
audio.onerror=()=>setNow("Das ließ sich nicht abspielen. Bitte etwas anderes wählen.");
// play() kann scheitern (z.B. noch nichts geladen, kein Netz): dann freundlich melden statt roter Fehler
const resume=()=>{if(!audio.src||!queue.length) return;audio.play().catch(()=>setNow(`<b>${esc(title)}</b> · bitte auf ▶ drücken`))};
$("pp").onclick=()=>audio.paused?resume():audio.pause();
$("prev").onclick=()=>{if(idx>0){idx--;start()}};
$("next").onclick=()=>{if(idx<queue.length-1){idx++;start()}};
if("mediaSession" in navigator){
  const ms=navigator.mediaSession;
  // Ältere iPhones kennen nicht jede Taste: dann diese einfach weglassen
  const set=(a,f)=>{try{ms.setActionHandler(a,f)}catch(e){}};
  set("play",resume);set("pause",()=>audio.pause());
  set("nexttrack",()=>$("next").click());set("previoustrack",()=>$("prev").click());
}

/* ---------- Mikrofon (Spracherkennung von Safari) ---------- */
function setBusy(on){$("mic").classList.toggle("busy",on);$("micText").textContent=on?"Einen Moment …":"Drücken und Wunsch sagen"}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(CAN_RECORD){
  $("mic").onclick=()=>{if(!$("mic").classList.contains("busy")) recordAndSearch().catch(e=>{recState=null;$("mic").classList.remove("on");setBusy(false);say("Aufnahme ging schief ("+((e&&(e.name||e.message))||"unbekannt")+"). Bitte eintippen.")})};
}
else if(!SR){$("micText").textContent="Sprechen geht hier leider nicht";$("mic").disabled=true;$("mic").style.opacity=.5}
else{
  // Auf dem iPhone kommt oft kein "fertig"-Signal. Deshalb: nach 1,5 Sekunden Stille selbst beenden
  // und mit dem zuletzt erkannten Text suchen, egal wie die Erkennung endet.
  let rec=null,heard="",silence=null,done=false;
  function finish(){
    if(done) return; done=true;
    clearTimeout(silence);
    try{rec&&rec.stop()}catch(e){}
    rec=null;$("mic").classList.remove("on");
    const t=heard.trim();
    if(t.length>1) search(t); else {setBusy(false);say("Ich habe nichts verstanden. Bitte noch einmal drücken.")}
  }
  $("mic").onclick=()=>{
    if($("mic").classList.contains("busy")) return;
    if(rec){finish();return}
    heard="";done=false;
    rec=new SR();rec.lang="de-DE";rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=1;
    rec.onresult=e=>{
      heard=[...e.results].map(x=>x[0].transcript).join(" ");say("„"+heard+"“");
      clearTimeout(silence);
      if(e.results[e.results.length-1].isFinal) finish();
      else silence=setTimeout(finish,1500);
    };
    rec.onend=finish;
    rec.onerror=e=>{if(e.error==="not-allowed"){done=true;rec=null;$("mic").classList.remove("on");setBusy(false);say("Bitte Mikrofon in den Einstellungen erlauben.")}else finish()};
    $("mic").classList.add("on");$("micText").textContent="Ich höre zu …";say("");
    silence=setTimeout(finish,8000); // spätestens nach 8 Sekunden
    try{rec.start()}catch(e){rec=null;$("mic").classList.remove("on");setBusy(false)}
  };
}
})();
</script>
